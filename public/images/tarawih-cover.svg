<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628"/>
      <stop offset="50%" style="stop-color:#0d2b1e"/>
      <stop offset="100%" style="stop-color:#061020"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5d060"/>
      <stop offset="50%" style="stop-color:#e8a020"/>
      <stop offset="100%" style="stop-color:#c8860a"/>
    </linearGradient>
    <linearGradient id="moonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fde68a"/>
      <stop offset="100%" style="stop-color:#f59e0b"/>
    </linearGradient>
    <linearGradient id="skyGlow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#1a4a2e;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#0a1628;stop-opacity:0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- Sky glow -->
  <ellipse cx="400" cy="120" rx="350" ry="180" fill="url(#skyGlow)"/>

  <!-- Stars -->
  <g fill="#fde68a" opacity="0.9" filter="url(#glow)">
    <circle cx="80" cy="60" r="1.5"/>
    <circle cx="150" cy="40" r="1"/>
    <circle cx="220" cy="80" r="2"/>
    <circle cx="300" cy="30" r="1.5"/>
    <circle cx="380" cy="55" r="1"/>
    <circle cx="450" cy="25" r="2"/>
    <circle cx="530" cy="70" r="1.5"/>
    <circle cx="600" cy="45" r="1"/>
    <circle cx="680" cy="35" r="2"/>
    <circle cx="720" cy="90" r="1.5"/>
    <circle cx="100" cy="120" r="1"/>
    <circle cx="170" cy="100" r="1.5"/>
    <circle cx="260" cy="140" r="1"/>
    <circle cx="340" cy="110" r="2"/>
    <circle cx="490" cy="130" r="1"/>
    <circle cx="560" cy="100" r="1.5"/>
    <circle cx="640" cy="120" r="1"/>
    <circle cx="750" cy="60" r="1.5"/>
    <circle cx="50" cy="90" r="1"/>
    <circle cx="760" cy="140" r="1"/>
  </g>

  <!-- Crescent Moon -->
  <g transform="translate(620, 80)" filter="url(#softGlow)">
    <circle cx="0" cy="0" r="55" fill="url(#moonGrad)" opacity="0.95"/>
    <circle cx="18" cy="-10" r="46" fill="#0d2b1e"/>
  </g>

  <!-- Star next to moon -->
  <g transform="translate(690, 55)" fill="#fde68a" filter="url(#glow)">
    <polygon points="0,-8 2,-3 7,-3 3,1 5,7 0,3 -5,7 -3,1 -7,-3 -2,-3" opacity="0.9"/>
  </g>

  <!-- Islamic geometric border top -->
  <g stroke="url(#goldGrad)" stroke-width="1" fill="none" opacity="0.4">
    <line x1="0" y1="8" x2="800" y2="8"/>
    <line x1="0" y1="14" x2="800" y2="14"/>
    <!-- Diamond pattern -->
    <g transform="translate(0,11)">
      <polygon points="20,0 30,8 20,16 10,8" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.5"/>
      <polygon points="60,0 70,8 60,16 50,8" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.5"/>
      <polygon points="100,0 110,8 100,16 90,8" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.5"/>
      <polygon points="140,0 150,8 140,16 130,8" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.5"/>
      <polygon points="180,0 190,8 180,16 170,8" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.5"/>
      <polygon points="220,0 230,8 220,16 210,8" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.5"/>
      <polygon points="260,0 270,8 260,16 250,8" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.5"/>
      <polygon points="300,0 310,8 300,16 290,8" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.5"/>
      <polygon points="340,0 350,8 340,16 330,8" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.5"/>
      <polygon points="380,0 390,8 380,16 370,8" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.5"/>
      <polygon points="420,0 430,8 420,16 410,8" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.5"/>
      <polygon points="460,0 470,8 460,16 450,8" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.5"/>
      <polygon points="500,0 510,8 500,16 490,8" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.5"/>
      <polygon points="540,0 550,8 540,16 530,8" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.5"/>
      <polygon points="580,0 590,8 580,16 570,8" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.5"/>
      <polygon points="620,0 630,8 620,16 610,8" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.5"/>
      <polygon points="660,0 670,8 660,16 650,8" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.5"/>
      <polygon points="700,0 710,8 700,16 690,8" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.5"/>
      <polygon points="740,0 750,8 740,16 730,8" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.5"/>
      <polygon points="780,0 790,8 780,16 770,8" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.5"/>
    </g>
  </g>

  <!-- Mosque silhouette -->
  <g fill="#1a3a2a" opacity="0.9">
    <!-- Main dome -->
    <ellipse cx="400" cy="310" rx="90" ry="70"/>
    <rect x="310" y="310" width="180" height="140"/>
    <!-- Left minaret -->
    <rect x="240" y="260" width="30" height="190"/>
    <ellipse cx="255" cy="255" rx="15" ry="20"/>
    <polygon points="255,225 248,255 262,255" fill="#1a3a2a"/>
    <!-- Right minaret -->
    <rect x="530" y="260" width="30" height="190"/>
    <ellipse cx="545" cy="255" rx="15" ry="20"/>
    <polygon points="545,225 538,255 552,255" fill="#1a3a2a"/>
    <!-- Side domes -->
    <ellipse cx="290" cy="330" rx="50" ry="40"/>
    <rect x="240" y="330" width="100" height="120"/>
    <ellipse cx="510" cy="330" rx="50" ry="40"/>
    <rect x="460" y="330" width="100" height="120"/>
    <!-- Arch windows -->
    <ellipse cx="400" cy="350" rx="25" ry="30" fill="#0d2b1e"/>
    <rect x="375" y="350" width="50" height="100" fill="#0d2b1e"/>
  </g>

  <!-- Mosque silhouette darker overlay for depth -->
  <g fill="#0f2a1a" opacity="0.6">
    <ellipse cx="400" cy="315" rx="85" ry="65"/>
    <rect x="315" y="315" width="170" height="135"/>
  </g>

  <!-- Lantern glow effect at mosque top -->
  <ellipse cx="400" cy="250" rx="60" ry="30" fill="#2d6a4f" opacity="0.3"/>

  <!-- Gold decorative line -->
  <line x1="100" y1="200" x2="700" y2="200" stroke="url(#goldGrad)" stroke-width="1" opacity="0.3"/>

  <!-- Main text: JADWAL IMAM TARAWIH -->
  <text x="400" y="165" text-anchor="middle" font-family="Georgia, serif" font-size="38" font-weight="bold" fill="url(#goldGrad)" filter="url(#glow)" letter-spacing="3">JADWAL IMAM TARAWIH</text>

  <!-- Subtitle -->
  <text x="400" y="195" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#86efac" opacity="0.9" letter-spacing="2">RAMADHAN 1447 H / 2026 M</text>

  <!-- Decorative dots -->
  <g fill="url(#goldGrad)" opacity="0.7">
    <circle cx="180" cy="165" r="3"/>
    <circle cx="195" cy="165" r="2"/>
    <circle cx="605" cy="165" r="3"/>
    <circle cx="620" cy="165" r="2"/>
  </g>

  <!-- Bottom border -->
  <g stroke="url(#goldGrad)" stroke-width="1" fill="none" opacity="0.4">
    <line x1="0" y1="436" x2="800" y2="436"/>
    <line x1="0" y1="442" x2="800" y2="442"/>
  </g>

  <!-- Ground line -->
  <rect x="0" y="440" width="800" height="10" fill="#061020"/>
</svg>
